            $ref: '#/definitions/models.HttpResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.HttpResponseError'
      security:
      - ApiKeyAuth: []
      summary: Retrieve all admins
      tags:
      - Admin
    post:
      consumes:
      - application/json
      description: Creates a new admin with the provided details
      parameters:
      - description: Admin object
