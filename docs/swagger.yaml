  /proteng-user-mgmt/auth/resetpassword/{resetToken}:
    patch:
      consumes:
      - application/json
      description: Resets the password using the provided reset token
      parameters:
      - description: Reset Token
        in: path
        name: resetToken
        required: true
        type: string
