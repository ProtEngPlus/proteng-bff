definitions:
  models.AdminInput:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  models.ChangePasswordInput:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    required:
    - current_password
    - new_password
    type: object
  models.DuplicateJobInput:
    properties:
      description:
        type: string
      input_protein:
        type: string
      lab_result:
        $ref: '#/definitions/models.LabResult'
      meta:
        items:
          type: string
        type: array
      name:
        type: string
      options:
        additionalProperties: true
        type: object
      ref_job_id:
        type: string
      run_type:
        type: string
    required:
    - input_protein
    - name
    - options
    type: object
  models.ForgotPasswordInput:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  models.HttpResponseError:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
  models.HttpResponseOK:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  models.JobInput:
    properties:
      description:
        type: string
      input_protein:
        type: string
      lab_result:
        $ref: '#/definitions/models.LabResult'
      meta:
        items:
          type: string
        type: array
      name:
        type: string
      options:
        additionalProperties: true
        type: object
      run_type:
        type: string
    required:
    - input_protein
    - name
    - options
    type: object
  models.LabResult:
    properties:
      scores:
        items:
          type: number
        type: array
      sequences:
        items:
          type: string
        type: array
      total:
        minimum: 0
        type: integer
    required:
    - scores
    - sequences
    type: object
  models.MutationInput:
    properties:
      input_protein:
        type: string
      job_id:
        type: string
      options:
        additionalProperties: true
        type: object
    type: object
  models.ResetPasswordInput:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  models.SendVerificationInput:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  models.SignInAdminInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  models.SignInInput:
    properties:
      email:
        type: string
      password:
        type: string
      role:
        type: string
    required:
    - email
    - password
    type: object
  models.UserInput:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        items:
          type: string
        type: array
      surname:
        type: string
      user_role:
        type: string
    type: object
info:
  contact:
    email: proteng.plus@gmail.com
    name: Proteng API Support
  title: Proteng API
  version: "1.0"
paths:
  /health:
    get:
      description: Check the health of the service
      produces:
      - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/models.HttpResponseOK'
      summary: Health Check Endpoint
      tags:
      - Healthchack
  /proteng-conductor/artifact/{bucketName}/{objectName}:
    get:
      consumes:
