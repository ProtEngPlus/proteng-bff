definitions:
  models.AdminInput:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  models.ChangePasswordInput:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    required:
    - current_password
    - new_password
    type: object
  models.ConfigurationInput:
    properties:
      artifact:
        additionalProperties: true
        type: object
      description:
        type: string
      input_protein:
        type: string
      is_notification_on:
        type: boolean
      lab_result:
        $ref: '#/definitions/models.LabResult'
      meta:
        items:
          type: string
        type: array
      name:
        type: string
      options:
        additionalProperties: true
        type: object
      ref_job_id:
        type: string
      run_type:
        type: string
      stage_id:
        maximum: 3
        minimum: 0
        type: integer
      state:
        type: string
      user_id:
        type: string
    required:
    - input_protein
    - name
    - options
    - ref_job_id
    - run_type
    - user_id
    type: object
  models.CopyQueryResultInput:
    properties:
      complete_at:
        type: string
      created_at:
        type: string
      id:
        type: string
      input_protein:
        type: string
      job_id:
        type: string
      result:
        items:
          $ref: '#/definitions/models.CopyResultInput'
        type: array
      run_id:
        type: integer
      state:
        type: string
    type: object
  models.CopyResultInput:
    properties:
      acc_len:
        type: integer
      accession:
        type: string
      description:
        type: string
      e_values:
        type: number
      hsp_query_from:
        type: number
      hsp_query_to:
        type: number
      id:
        type: string
      is_selected:
        type: boolean
      max_score:
        type: number
      organisms:
        type: string
      percent_identity:
        type: number
      query_cover:
        type: number
      score:
        type: number
      sequences:
        type: string
    type: object
  models.CreateJobInput:
    properties:
      job:
        $ref: '#/definitions/models.JobInput'
      query_result:
        $ref: '#/definitions/models.CopyQueryResultInput'
    required:
    - job
    type: object
  models.ForgotPasswordInput:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  models.HttpResponseError:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
  models.HttpResponseOK:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  models.JobInput:
    properties:
      artifact:
        additionalProperties: true
        type: object
      description:
        type: string
      input_protein:
        type: string
      is_notification_on:
        type: boolean
      lab_result:
        $ref: '#/definitions/models.LabResult'
      meta:
        items:
          type: string
        type: array
      name:
        type: string
      options:
        additionalProperties: true
        type: object
      ref_job_id:
        type: string
      run_type:
        type: string
      stage_id:
        maximum: 3
        minimum: 0
        type: integer
    required:
    - input_protein
    - name
    - options
    - run_type
    type: object
  models.LabResult:
    properties:
      scores:
        items:
          type: number
        type: array
      sequences:
        items:
          type: string
        type: array
      total:
        minimum: 0
        type: integer
    required:
    - scores
    - sequences
    type: object
  models.MutationInput:
    properties:
      input_protein:
        type: string
      job_id:
        type: string
      options:
        additionalProperties: true
        type: object
    type: object
  models.MutationResultInput:
    properties:
      is_bookmark:
        type: boolean
    type: object
  models.QueryResultInput:
    properties:
      input_protein:
        type: string
      is_selected:
        type: boolean
      job_id:
        type: string
    type: object
  models.ResetPasswordInput:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  models.SendVerificationInput:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  models.SignInAdminInput:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  models.SignInInput:
    properties:
      email:
        type: string
      password:
        type: string
      role:
        type: string
    required:
    - email
    - password
    type: object
  models.UserInput:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        items:
          type: string
        type: array
      surname:
        type: string
      user_role:
        type: string
    type: object
info:
  contact:
    email: proteng.plus@gmail.com
    name: Proteng API Support
  title: Proteng API
  version: "1.0"
paths:
  /health:
    get:
      description: Check the health of the service
      produces:
      - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/models.HttpResponseOK'
      summary: Health Check Endpoint
      tags:
      - Healthchack
  /proteng-conductor/artifact/{bucketName}/{objectName}:
    get:
      consumes:
      - application/json
      description: Download an artifact of a job
      parameters:
      - description: Bucket Name
        in: path
        name: bucketName
        required: true
        type: string
      - description: Object Name
        in: path
        name: objectName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/models.HttpResponseOK'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.HttpResponseError'
      security:
      - ApiKeyAuth: []
      summary: Download Artifact
      tags:
      - Artifact
  /proteng-conductor/jobs:
    get:
      description: Retrieve a list of all jobs
      parameters:
      - description: Filter state of the jobs
        in: query
        name: state
        type: string
      - description: Filter name of the job
        in: query
        name: name
        type: string
      - description: Sort by
        in: query
        name: sort
        type: string
      - description: Sort direction (asc/desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/models.HttpResponseOK'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.HttpResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.HttpResponseError'
      security:
      - ApiKeyAuth: []
      summary: Get all jobs
      tags:
      - Jobs
    post:
      consumes:
      - application/json
      description: Create a new job with the provided details
      parameters:
      - description: Create object
        in: body
        name: job
        required: true
        schema:
          $ref: '#/definitions/models.CreateJobInput'
      produces:
      - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/models.HttpResponseOK'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/models.HttpResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.HttpResponseError'
      security:
      - ApiKeyAuth: []
      summary: Create a new job
      tags:
      - Jobs
  /proteng-conductor/jobs/{id}:
    delete:
      description: Delete a job by its ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/models.HttpResponseOK'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/models.HttpResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.HttpResponseError'
      security:
      - ApiKeyAuth: []
      summary: Delete a job by ID
      tags:
      - Jobs
    get:
      description: Retrieve details of a job by its ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/models.HttpResponseOK'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.HttpResponseError'
        "404":
          description: Not found
          schema:
