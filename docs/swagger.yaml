          schema:
            $ref: '#/definitions/models.HttpResponseOK'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.HttpResponseError'
      security:
      - ApiKeyAuth: []
      summary: Download Artifact
      tags:
      - Artifact
